[package]
name = "silkboard-publish"
version.workspace = true
edition = "2024"
publish = false
description = "Standalone best-effort Silkboard progress publisher"
license = "MIT"

[lints]
workspace = true

[dependencies]
silkboard-plan = { path = "../silkboard-plan" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
getrandom = "=0.3.4"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
silkboard-web = { path = "../silkboard-web" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
