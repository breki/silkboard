[package]
name = "silkboard-web"
version = "0.5.0"
edition = "2024"
publish = false
description = "Silkboard status application"
license = "MIT"

[lints]
workspace = true

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
sha2 = "=0.10.9"
getrandom = "=0.3.4"
serde_json = "1"
argon2 = "=0.5.3"
subtle = "=2.6.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
