[package]
name = "silkboard-web"
version = "0.2.1"
edition = "2024"
publish = false
description = "Silkboard status application"
license = "MIT"

[lints]
workspace = true

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
