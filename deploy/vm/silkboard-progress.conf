# Opt-in operator drop-in: /etc/systemd/system/silkboard.service.d/20-progress.conf
# Install only after a reviewed schema-3 release and approved rollout procedure.
[Service]
StateDirectory=silkboard/progress
StateDirectoryMode=0700
Environment=SILKBOARD_DATABASE=/var/lib/silkboard/progress/progress.sqlite
# Required: set SILKBOARD_OWNER_ORIGIN in an operator-owned drop-in.
# No deployment-specific origin is supplied by this template.
