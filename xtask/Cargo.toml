[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false
description = "Silkboard repository checks"
license = "MIT"

[lints]
workspace = true

[[test]]
name = "stop_check"
path = "../.codex/hooks/tests/stop_check.rs"

[dependencies]
silkboard-updater = { path = "../crates/silkboard-updater" }
serde_json = "1"
toml = { version = "=0.8.23", default-features = false, features = ["parse"] }
serde = { version = "1", features = ["derive"] }
