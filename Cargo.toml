[workspace]
members = [
    "crates/silkboard-web",
    "crates/silkboard-plan",
    "crates/silkboard-updater",
    "crates/silkboard-publish",
    "xtask",
]
resolver = "2"

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
perf = { level = "deny", priority = -1 }

[profile.test]
opt-level = 1
