[workspace]
members = [
    "crates/silkboard-web",
    "crates/silkboard-plan",
    "crates/silkboard-updater",
    "crates/silkboard-publish",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.12.0"

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
perf = { level = "deny", priority = -1 }

[profile.test]
# Compile workspace tests quickly while retaining useful backtrace information.
opt-level = 0
debug = 1

[profile.test.package."*"]
# Keep third-party crypto/TLS and parser code optimized in test processes.
opt-level = 1
debug = 2
