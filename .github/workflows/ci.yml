name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# Keep this CI namespace separate from caller-level concurrency. Only updates
# to the same PR/calling workflow cancel work; other events have unique groups.
concurrency:
  group: silkboard-ci-${{ github.workflow_ref }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-attempt-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Full validation (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Select the event commit without rewriting its signed tag ref.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Configure separate Rust build directories
        run: |
          {
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/silkboard-ci-rust/normal"
            echo "CARGO_LLVM_COV_TARGET_DIR=$RUNNER_TEMP/silkboard-ci-rust/coverage"
            echo "CI_ARM64_TARGET_DIR=$RUNNER_TEMP/silkboard-ci-rust/arm64"
          } >> "$GITHUB_ENV"
      - name: Install minimal pinned Rust toolchain
        run: |
          rustup toolchain install 1.93.1 --profile minimal
          rustup override set 1.93.1
      # No path filters or additional jobs: release callers retain their exact
      # required job set. Missing/failed classification means full validation.
      - name: Classify PR changes
        id: scope
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mode=full
          if result=$(cargo xtask ci-mode "$GITHUB_EVENT_NAME" "$PR_BASE_SHA" "$GITHUB_SHA"); then
            if [[ $result == docs ]]; then mode=docs; fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Check documentation-only PR
        if: github.event_name == 'pull_request' && steps.scope.outputs.mode == 'docs'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          cargo xtask canon-check
          git diff --check "$PR_BASE_SHA" "$GITHUB_SHA" --
          echo 'Documentation-only PR: canon links/tooling claims and diff checks passed. Application gates were not run; this is not release eligibility evidence.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: github.event_name != 'pull_request' || steps.scope.outputs.mode != 'docs'
        with:
          node-version: 24.14.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install full Rust components
        if: github.event_name != 'pull_request' || steps.scope.outputs.mode != 'docs'
        run: |
          rustup component add --toolchain 1.93.1 rustfmt clippy llvm-tools-preview
          rustup target add --toolchain 1.93.1 aarch64-unknown-linux-gnu
      # PR cache entries are distinct from main/release entries. No prefix
      # fallback: the workflow hash binds tool versions and installation logic.
      - name: Restore trusted gate tools
        if: github.event_name != 'pull_request' || steps.scope.outputs.mode != 'docs'
        id: gate-tools
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/silkboard-ci-tools/bin
          key: gate-tools-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu24-rust1.93.1-trusted-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Restore PR gate tools
        id: pr-gate-tools
        if: github.event_name == 'pull_request' && steps.scope.outputs.mode != 'docs' && steps.gate-tools.outputs.cache-hit != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/silkboard-ci-tools/bin
          key: gate-tools-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu24-rust1.93.1-pr-${{ github.event.pull_request.number }}-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Install required gate tools
        if: (github.event_name != 'pull_request' || steps.scope.outputs.mode != 'docs') && steps.gate-tools.outputs.cache-hit != 'true' && steps.pr-gate-tools.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          # Tool compilation must not enter the application's build caches.
          unset CARGO_TARGET_DIR CARGO_LLVM_COV_TARGET_DIR CI_ARM64_TARGET_DIR
          ci_tools_root="$RUNNER_TEMP/silkboard-ci-tools"
          cargo +1.93.1 install --locked --force --root "$ci_tools_root" cargo-llvm-cov@0.9.0
          cargo +1.93.1 install --locked --force --root "$ci_tools_root" code-dupes@0.2.1
          cargo +1.93.1 install --locked --force --root "$ci_tools_root" cargo-deny@0.20.2
          cargo +1.93.1 install --locked --force --root "$ci_tools_root" cargo-audit@0.22.2
      - name: Select pinned gate tools
        if: github.event_name != 'pull_request' || steps.scope.outputs.mode != 'docs'
        run: echo "$RUNNER_TEMP/silkboard-ci-tools/bin" >> "$GITHUB_PATH"
      - name: Check gate tool versions
        if: github.event_name != 'pull_request' || steps.scope.outputs.mode != 'docs'
        run: |
          test "$(cargo llvm-cov --version)" = 'cargo-llvm-cov 0.9.0'
          test "$(code-dupes --version)" = 'code-dupes 0.2.1'
          test "$(cargo deny --version)" = 'cargo-deny 0.20.2'
          test "$(cargo-audit --version)" = 'cargo-audit 0.22.2'
      # Save before frontend dependency scripts and full application validation.
      - name: Save pinned gate tools
        if: (github.event_name != 'pull_request' || steps.scope.outputs.mode != 'docs') && steps.gate-tools.outputs.cache-hit != 'true' && steps.pr-gate-tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/silkboard-ci-tools/bin
          key: ${{ github.event_name == 'pull_request' && steps.pr-gate-tools.outputs.cache-primary-key || steps.gate-tools.outputs.cache-primary-key }}
      - name: Plan isolated Rust dependency caches
        id: rust_cache
        if: github.event_name != 'pull_request' || steps.scope.outputs.mode != 'docs'
        env:
          CACHE_CONFIG_HASH: ${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/**', 'rust-toolchain*', '.github/workflows/ci.yml', 'xtask/**') }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: cargo xtask ci-cache-plan >> "$GITHUB_OUTPUT"
      # Only exact configuration keys. PR-local keys also bind the head SHA;
      # trusted runs never look up a PR namespace or promote a PR archive.
      - name: Restore trusted normal dependency builds
        id: normal_cache
        if: steps.rust_cache.outputs.enabled == 'true'
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CARGO_TARGET_DIR }}
          key: ${{ steps.rust_cache.outputs.normal_trusted }}
      - name: Restore PR normal dependency builds
        id: normal_pr_cache
        if: steps.rust_cache.outputs.enabled == 'true' && github.event_name == 'pull_request' && steps.normal_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CARGO_TARGET_DIR }}
          key: ${{ steps.rust_cache.outputs.normal_local }}
      - name: Restore trusted coverage dependency builds
        id: coverage_cache
        if: steps.rust_cache.outputs.enabled == 'true'
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CARGO_LLVM_COV_TARGET_DIR }}
          key: ${{ steps.rust_cache.outputs.coverage_trusted }}
      - name: Restore PR coverage dependency builds
        id: coverage_pr_cache
        if: steps.rust_cache.outputs.enabled == 'true' && github.event_name == 'pull_request' && steps.coverage_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CARGO_LLVM_COV_TARGET_DIR }}
          key: ${{ steps.rust_cache.outputs.coverage_local }}
      - name: Restore trusted ARM64 dependency builds
        id: arm64_cache
        if: steps.rust_cache.outputs.enabled == 'true'
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CI_ARM64_TARGET_DIR }}
          key: ${{ steps.rust_cache.outputs.arm64_trusted }}
      - name: Restore PR ARM64 dependency builds
        id: arm64_pr_cache
        if: steps.rust_cache.outputs.enabled == 'true' && github.event_name == 'pull_request' && steps.arm64_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CI_ARM64_TARGET_DIR }}
          key: ${{ steps.rust_cache.outputs.arm64_local }}
      - name: Discard partial builds after a failed restore
        if: steps.normal_cache.outcome == 'failure' || steps.normal_pr_cache.outcome == 'failure' || steps.coverage_cache.outcome == 'failure' || steps.coverage_pr_cache.outcome == 'failure' || steps.arm64_cache.outcome == 'failure' || steps.arm64_pr_cache.outcome == 'failure'
        run: |
          cargo clean --target-dir "$CARGO_TARGET_DIR"
          cargo clean --target-dir "$CARGO_LLVM_COV_TARGET_DIR"
          cargo clean --target-dir "$CI_ARM64_TARGET_DIR"
          echo 'A Rust cache restore failed. Discarded all partial build caches; all gates use cold builds.' >> "$GITHUB_STEP_SUMMARY"
      - name: Install locked frontend tools and Chromium
        if: github.event_name != 'pull_request' || steps.scope.outputs.mode != 'docs'
        working-directory: frontend
        run: |
          npm ci
          npm exec -- playwright install --with-deps chromium
      - name: Fetch locked Rust dependencies
        if: github.event_name != 'pull_request' || steps.scope.outputs.mode != 'docs'
        run: cargo fetch --locked
      - name: Full read-only validation
        if: github.event_name != 'pull_request' || steps.scope.outputs.mode != 'docs'
        run: cargo xtask validate --check
      - name: ARM64 cross-target lint
        if: github.event_name != 'pull_request' || steps.scope.outputs.mode != 'docs'
        env:
          CARGO_TARGET_DIR: ${{ env.CI_ARM64_TARGET_DIR }}
        run: cargo xtask clippy --target aarch64-unknown-linux-gnu
      # Explicit saves happen only after the full gate suite and ARM64 pass.
      # No workspace binaries, reports, raw profiles or verdicts are archived.
      - name: Clean and verify dependency-only Rust archives
        id: rust_cache_prune
        if: steps.rust_cache.outputs.enabled == 'true' && ((steps.normal_cache.outputs.cache-hit != 'true' && steps.normal_pr_cache.outputs.cache-hit != 'true') || (steps.coverage_cache.outputs.cache-hit != 'true' && steps.coverage_pr_cache.outputs.cache-hit != 'true') || (steps.arm64_cache.outputs.cache-hit != 'true' && steps.arm64_pr_cache.outputs.cache-hit != 'true'))
        env:
          CACHE_CONFIG_HASH: ${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/**', 'rust-toolchain*', '.github/workflows/ci.yml', 'xtask/**') }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_NORMAL_KEY: ${{ steps.rust_cache.outputs.normal_local }}
        run: cargo xtask ci-cache-prune "$RUNNER_TEMP" "$EXPECTED_NORMAL_KEY"
      - name: Save normal dependency builds
        if: steps.rust_cache_prune.outcome == 'success' && steps.normal_cache.outputs.cache-hit != 'true' && steps.normal_pr_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CARGO_TARGET_DIR }}
          key: ${{ steps.rust_cache.outputs.normal_local }}
      - name: Save coverage dependency builds
        if: steps.rust_cache_prune.outcome == 'success' && steps.coverage_cache.outputs.cache-hit != 'true' && steps.coverage_pr_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CARGO_LLVM_COV_TARGET_DIR }}
          key: ${{ steps.rust_cache.outputs.coverage_local }}
      - name: Save ARM64 dependency builds
        if: steps.rust_cache_prune.outcome == 'success' && steps.arm64_cache.outputs.cache-hit != 'true' && steps.arm64_pr_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CI_ARM64_TARGET_DIR }}
          key: ${{ steps.rust_cache.outputs.arm64_local }}
