name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Full validation (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Select the event commit without rewriting its signed tag ref.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.93.1 --profile minimal --component rustfmt,clippy,llvm-tools-preview --target aarch64-unknown-linux-gnu
          rustup override set 1.93.1
      # Security/coverage tools are built fresh, without restored executable or
      # registry caches. Their published lockfiles fix transitive versions.
      - name: Install required gate tools
        run: |
          cargo install --locked --force cargo-llvm-cov@0.9.0
          cargo install --locked --force code-dupes@0.2.1
          cargo install --locked --force cargo-deny@0.20.2
          cargo install --locked --force cargo-audit@0.22.2
      - name: Install locked frontend tools and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm exec -- playwright install --with-deps chromium
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked
      - name: Full read-only validation
        run: cargo xtask validate --check
      - name: ARM64 cross-target lint
        run: cargo xtask clippy --target aarch64-unknown-linux-gnu
